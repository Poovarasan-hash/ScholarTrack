<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In — ScholarTrack</title>

    <meta
        name="description"
        content="Sign in to your ScholarTrack student account to monitor scholarship application deadlines, view saved items, and track your progress."
    >

    <meta name="theme-color" content="#739B8A">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <!-- Top Navigation Header -->
    <header class="auth-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="auth-brand" href="index.html">
                <span class="auth-brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </span>
                <span>Scholar<span class="auth-brand-highlight">Track</span></span>
            </a>

            <a href="index.html" class="text-white small fw-bold text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="auth-card-wrapper">

            <div class="auth-card-header">
                <h1>Welcome Back</h1>
                <p>Log in to access your scholarship deadlines and tracker</p>
            </div>

            <!-- Server & Form Feedback Banner -->
            <div
                class="auth-message"
                id="authMessage"
                role="alert"
                aria-live="polite"
            ></div>

            <form id="loginForm" novalidate>

                <!-- Email Input -->
                <div class="auth-form-group">
                    <label class="auth-label" for="email">Email Address</label>
                    <div class="auth-input-wrapper">
                        <input
                            type="email"
                            class="auth-input"
                            id="email"
                            placeholder="student@example.edu"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="auth-form-group">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="auth-label mb-0" for="password">Password</label>
                    </div>
                    <div class="auth-input-wrapper">
                        <input
                            type="password"
                            class="auth-input"
                            id="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="auth-password-toggle"
                            id="togglePassword"
                            aria-label="Toggle password visibility"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="btn-auth-primary mt-2"
                    id="loginButton"
                >
                    <span id="loginButtonText">Sign In</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="auth-card-footer">
                <span>Don't have an account yet?</span>
                <a href="signup.html" class="fw-bold ms-1">Create an account</a>
            </div>

        </div>
    </main>

    <footer class="auth-page-footer">
        <p class="mb-0">
            &copy; 2026 ScholarTrack. Secure student authentication.
        </p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
