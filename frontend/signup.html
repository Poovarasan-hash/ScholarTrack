<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — ScholarTrack</title>

    <meta
        name="description"
        content="Create a free ScholarTrack account to discover verified scholarships, verify your eligibility criteria, and keep track of application deadlines."
    >

    <meta name="theme-color" content="#739B8A">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="signup-page">

    <!-- Header -->
    <header class="signup-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="signup-brand" href="index.html">
                <span class="signup-brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </span>
                <span>Scholar<span class="signup-brand-highlight">Track</span></span>
            </a>

            <a href="index.html" class="text-white small fw-bold text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="signup-card-wrapper">

            <div class="signup-card-header">
                <h1>Create Student Account</h1>
                <p>Start tracking scholarship opportunities and deadlines</p>
            </div>

            <!-- Server & Form Feedback Banner -->
            <div
                class="signup-message"
                id="signupMessage"
                role="alert"
                aria-live="polite"
            ></div>

            <form id="signupForm" novalidate>

                <!-- Full Name -->
                <div class="signup-form-group">
                    <label class="signup-label" for="fullName">Full Name</label>
                    <div class="signup-input-wrapper">
                        <input
                            type="text"
                            class="signup-input"
                            id="fullName"
                            placeholder="Alex Morgan"
                            required
                            autocomplete="name"
                        >
                    </div>
                </div>

                <!-- Email Address -->
                <div class="signup-form-group">
                    <label class="signup-label" for="email">Email Address</label>
                    <div class="signup-input-wrapper">
                        <input
                            type="email"
                            class="signup-input"
                            id="email"
                            placeholder="student@example.edu"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Education Level & Institution Row -->
                <div class="row g-3 signup-form-group">
                    <div class="col-md-6">
                        <label class="signup-label" for="educationLevel">Education Level</label>
                        <select class="signup-input form-select" id="educationLevel" required>
                            <option value="">Select Level</option>
                            <option value="Undergraduate">Undergraduate</option>
                            <option value="Postgraduate">Postgraduate</option>
                            <option value="Doctoral / PhD">Doctoral / PhD</option>
                            <option value="Diploma / Polytechnic">Diploma / Polytechnic</option>
                            <option value="High School">High School (11th-12th)</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="signup-label" for="institution">Institution / University</label>
                        <input
                            type="text"
                            class="signup-input"
                            id="institution"
                            placeholder="University / College"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="signup-form-group">
                    <label class="signup-label" for="password">Password</label>
                    <div class="signup-input-wrapper">
                        <input
                            type="password"
                            class="signup-input"
                            id="password"
                            placeholder="At least 8 characters (A-Z, a-z, 0-9)"
                            required
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="signup-password-toggle"
                            id="togglePassword"
                            data-toggle-password="password"
                            aria-label="Toggle password visibility"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="signup-form-group">
                    <label class="signup-label" for="confirmPassword">Confirm Password</label>
                    <div class="signup-input-wrapper">
                        <input
                            type="password"
                            class="signup-input"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="signup-password-toggle"
                            id="toggleConfirmPassword"
                            data-toggle-password="confirmPassword"
                            aria-label="Toggle password visibility"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms and Transparency Agreement -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                    <label class="form-check-label small text-secondary" for="agreeTerms">
                        I agree to the Terms of Service & Privacy Policy, and understand that ScholarTrack provides illustrative match tracking.
                    </label>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="btn-signup-primary"
                    id="signupButton"
                >
                    <span id="signupButtonText">Create Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="signup-card-footer">
                <span>Already have an account?</span>
                <a href="login.html" class="fw-bold ms-1">Log in here</a>
            </div>

        </div>
    </main>

    <footer class="auth-page-footer">
        <p class="mb-0">
            &copy; 2026 ScholarTrack. Empowering educational opportunities.
        </p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
